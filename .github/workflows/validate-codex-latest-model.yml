name: Validate latest Codex session model
on:
  push:
    branches: [validation/ecc-codex-latest-model-20261116]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm baseline model-switch failures
        run: |
          node - <<'JS'
          const { spawnSync } = require('child_process');
          const assert = require('assert');
          const r = spawnSync(process.execPath, ['tests/lib/session-adapters-codex.test.js'], { encoding: 'utf8' });
          process.stdout.write(r.stdout);
          process.stderr.write(r.stderr);
          const match = r.stdout.match(/=== Results: (\d+) passed, (\d+) failed ===/);
          assert.ok(match, 'Complete test summary required');
          const report = { version: process.version, status: r.status, passed: Number(match[1]), failed: Number(match[2]) };
          console.log('ECC_CODEX_MODEL_BASELINE=' + JSON.stringify(report));
          assert.strictEqual(r.status, 1);
          assert.strictEqual(report.failed, 2);
          assert.strictEqual(report.passed, 12);
          JS
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit all fork branches and upstream pull request history
        run: python3 .audit/ecc-codex-latest-model/history.py
